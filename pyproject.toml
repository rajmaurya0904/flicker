[project]
name = "flicker"
version = "0.1.0"
description = "A zero-config CLI tool that records terminal sessions directly to highly optimized MP4 or WebM screencasts for documentation and bug reports, without requiring heavy screen recording software."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["terminal", "screencast", "ffmpeg", "asciicast", "mp4", "webm"]
dependencies = [
    "pyte>=0.8.2",
    "Pillow>=10.1",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
flicker = "flicker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flicker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]